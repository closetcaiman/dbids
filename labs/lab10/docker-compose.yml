services:
  generator:
    build:
      context: ./common/dockerfiles/retail-generator
      dockerfile: Dockerfile
    image: retail_lab_generator
    container_name: retail_lab_generator
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./labs/lab10/data:/data
    command: ["python", "generate_data.py", "--output", "/data"]

  sqlite:
    build:
      context: ./common/dockerfiles/sqlite-loader
      dockerfile: Dockerfile
    image: retail_lab_sqlite_loader
    container_name: retail_lab_sqlite
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      generator:
        condition: service_completed_successfully
    volumes:
      - ./labs/lab10/data:/data:ro
      - ./labs/lab10/db:/db
    command: ["python", "create_sqlite_db.py", "--dataset", "medium", "--data-dir", "/data", "--output", "/db/northwind_plus.db"]

  postgres:
    image: postgres:16
    container_name: retail_lab_postgres
    depends_on:
      generator:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: retail_lab
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./labs/lab10/data:/data:ro
      - ./common/sql/retail/postgres:/docker-entrypoint-initdb.d:ro

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: retail_lab_clickhouse
    depends_on:
      generator:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: student
      CLICKHOUSE_DB: retail
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./labs/lab10/data:/mnt/user_files/data:ro
      - ./common/clickhouse-config/user_files.xml:/etc/clickhouse-server/config.d/user_files.xml:ro
      - ./common/sql/retail/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  clickhouse_data: