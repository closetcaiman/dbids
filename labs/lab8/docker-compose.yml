services:
  couchbase:
    image: couchbase:community-7.2.4
    container_name: couchbase
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    volumes:
      - cbdata:/opt/couchbase/var
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/ui/index.html"]
      interval: 5s
      timeout: 3s
      retries: 10

  couchbase_init:
    profiles: ["init"]
    image: curlimages/curl:8.5.0
    container_name: couchbase-init
    depends_on:
      couchbase:
        condition: service_healthy
    volumes:
      - ./labs/lab8/scripts/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    network_mode: "service:couchbase"

  couchbase_import:
    profiles: ["init"]
    image: couchbase:community-7.2.4
    container_name: couchbase-import
    depends_on:
      couchbase_init:
        condition: service_completed_successfully
    volumes:
      - ./labs/lab8/scripts/import.sh:/import.sh:ro
      - ./common/data/northwind:/data/northwind:ro
    entrypoint: ["/bin/sh", "/import.sh"]
    restart: "no"
    network_mode: "service:couchbase"

volumes:
  cbdata: