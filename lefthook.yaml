pre-commit:
  commands:
    markdown-lint:
      glob: "**/*.md"
      run: ./common/scripts/markdown-lint.sh {staged_files}
    ruff-format:
      glob: "**/*.{py,ipynb}"
      run: uv run ruff format --check {staged_files}
    ruff-lint:
      glob: "**/*.{py,ipynb}"
      run: uv run ruff check {staged_files}
    ty:
      glob: "**/*.{py,ipynb}"
      run: uv run ty check
