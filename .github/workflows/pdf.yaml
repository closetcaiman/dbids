name: Generate PDFs

on:
  push:
    branches: [main]
    paths:
      - "labs/*/report.md"
      - "common/templates/report.typ"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.find.outputs.labs }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover lab directories
        id: find
        run: |
          labs=$(find labs -mindepth 1 -maxdepth 1 -type d -name 'lab*' | sort | xargs -I{} basename {} | jq -R . | jq -sc .)
          echo "labs=$labs" >> "$GITHUB_OUTPUT"

  pdf:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJson(needs.discover.outputs.labs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate PDF for ${{ matrix.lab }}
        run: |
          if [ -f "labs/${{ matrix.lab }}/report.md" ]; then
            make pdf LAB=${{ matrix.lab }}
          else
            echo "No report.md for ${{ matrix.lab }}, skipping"
          fi
