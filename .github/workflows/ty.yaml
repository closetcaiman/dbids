name: ty

on:
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.ipynb"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.ipynb"

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Type check
        run: uv run ty check
